<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="static/img/LOGOU.png" type="image/x-icon">
    <title>Registro - Pedidos App</title>
    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- CSS Principal -->
    <link rel="stylesheet" href="../static/css/main.css">
</head>
<body>
    <div class="container">
        <div class="row justify-content-center align-items-center" style="min-height: 100vh;">
            <div class="col-md-5">
                <div class="card fade-in-up">
                    <div class="card-header">
                        <h2 class="mb-0" style="color: rgb(255, 255, 255); background: none; -webkit-text-fill-color: rgb(0, 0, 0);">
                            <img src="static/img/LOGOU.png" alt="Bienvenido" class="logo" width="100px" height="100px">
                            Crear Cuenta
                        </h2>
                        <p style="color: rgba(0, 0, 0, 0.9); margin: 0; font-size: 0.95rem;">
                            Únete a nuestra comunidad
                        </p>
                    </div>
                    
                    <div class="card-body">
                        <form action="{{ url_for('register') }}" method="POST">
                            <div class="mb-3">
                                <label for="nombre" class="form-label">👤 Nombre Completo</label>
                                <input 
                                    type="text" 
                                    class="form-control" 
                                    id="nombre" 
                                    name="nombre" 
                                    placeholder="Tu nombre" 
                                    required
                                >
                            </div>
                            
                            <div class="mb-3">
                                <label for="correo" class="form-label">📧 Correo Electrónico</label>
                                <input 
                                    type="email" 
                                    class="form-control" 
                                    id="correo" 
                                    name="correo" 
                                    placeholder="tu@email.com" 
                                    required
                                >
                            </div>
                            
                            <div class="mb-4">
                                <label for="password" class="form-label">🔒 Contraseña</label>
                                <input 
                                    type="password" 
                                    class="form-control" 
                                    id="password" 
                                    name="password" 
                                    placeholder="••••••••" 
                                    required
                                >
                                <small class="text-muted">Mínimo 6 caracteres</small>
                            </div>
                            
                            <button type="submit" class="btn btn-primary btn-block w-100">
                                Crear Cuenta
                            </button>
                        </form>
                        
                        <div class="nav-links">
                            <p class="text-center mb-0">
                                ¿Ya tienes cuenta? 
                                <a href="/login">Inicia Sesión</a>
                            </p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
